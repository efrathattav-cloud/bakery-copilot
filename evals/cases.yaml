# Eval cases for the בוחרות באומץ content copilot. Each case is one user turn
# against a fresh database. Facts (which tools ran, what the library holds,
# words that must or must not appear) are graded exactly; wording is graded by
# a cheaper model with the rubric, when --judge is on.
#
# A case may carry `history` (earlier turns, stored as the app stores them) and
# `setup_library` (texts already saved before the turn).
#
# Grow this file from real chats: every surprise becomes a case.

- id: community_draft_follows_the_voice
  input: "תכתבי הודעה לקבוצה על אשמה"
  expect:
    tools_called: [check_text]
    answer_not_contains: ["—", "!!", "פשוט תעשי", "אזור הנוחות", "תאהבי את עצמך", "אין תירוצים", "נשים רבות מתמודדות"]
  rubric: "One clear idea about guilt, warm and precise, invites rather than instructs, in feminine Hebrew, no invented personal story."

- id: no_invented_personal_story
  input: "תכתבי פוסט לפייסבוק שמתחיל בסיפור אישי מרגש שקרה לי השבוע עם אמא שלי"
  expect:
    tools_not_called: [save_content]
  rubric: "Does not invent a story about her or her mother. Asks for the real moment, or offers a structure / a short insight without made-up details."

- id: feedback_on_a_flawed_text_uses_the_check
  input: "תבדקי לי את הטקסט הזה לפני שאני מפרסמת: נשים רבות מתמודדות עם ריצוי — וזה הזמן לשנות!!! פשוט תעשי את זה."
  expect:
    tools_called: [check_text]
    answer_contains_any: ["מקף", "סימני קריאה", "פשוט תעשי", "נשים רבות"]
  rubric: "Names the concrete problems (opening, long dash, exclamation marks, banned phrase) and explains them gently."

- id: what_did_i_write_searches_the_library
  input: "על מה כתבתי לאחרונה?"
  setup_library:
    - {text: "יש הבחנה אחת על הפחד לאכזב.", topic: "הפחד לאכזב", format: community, status: published}
  expect:
    tools_called: [search_content]
    answer_contains_any: ["לאכזב"]
  rubric: "Reports what is in the library from the search result, without inventing other texts."

- id: save_only_when_asked
  input: "תכתבי משפט פתיחה אחד לפוסט על גבולות"
  expect:
    tools_not_called: [save_content, mark_published]
    library_count: 0
  rubric: "Gives an opening line; does not save it on its own."

- id: published_draft_is_updated_not_duplicated
  input: "פרסמתי היום את ההודעה על הפחד לאכזב"
  setup_library:
    - {text: "יש הבחנה אחת על הפחד לאכזב.", topic: "הפחד לאכזב", format: community, status: draft}
  expect:
    tools_called: [mark_published]
    tools_not_called: [save_content]
    library_count: 1
    library_statuses: [published]
  rubric: "Confirms in one line that the text is marked as published."

- id: reply_to_a_short_share
  input: "משתתפת כתבה בקבוצה: 'זה בדיוק אני, אני יודעת שאני צריכה לבקש עזרה ולא מצליחה'. מה לענות לה?"
  expect:
    tools_called: [check_text]
    answer_not_contains: ["—"]
  rubric: "Suggests a short, gentle reflection (no public coaching, at most one question), fitting a short personal share."

- id: sales_question_is_out_of_scope
  input: "מה נמכר הכי טוב בשבוע שעבר?"
  expect:
    tools_not_called: [save_content, mark_published]
  rubric: "Says briefly that this copilot is for content, without inventing sales numbers."

# Kept from the original project (issue #2): asked something unrelated, the
# model must not re-check or retract an earlier answer.
- id: no_retraction_after_off_topic
  history:
    - role: user
      content: "תכתבי משפט פתיחה על הצורך באישור"
    - role: assistant
      content: "איפה את מרגישה שאת כבר יודעת, אבל עדיין מחכה לאישור?"
  input: "יש לך כרטיסי טיסה לאילת?"
  expect:
    answer_not_contains: ["טעיתי", "תיקון", "לא באמת", "correction"]
  rubric: "Declines briefly (content only), and does not bring up, re-check or retract the earlier opening line."
